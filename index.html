<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrada - Helpdesk Escolar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topo">
        <div class="topo-conteudo">
            <div class="topo-marca">Helpdesk Escolar</div>
        </div>
    </header>

    <main class="conteudo-entrada">

        <div class="cartoes-entrada">

            <!-- CARTÃO DO USUÁRIO -->
            <section class="cartao cartao-entrada">

                <h1>Acesso ao sistema</h1>

                <p class="subtitulo">
                    Entre para acessar o Helpdesk Escolar.
                </p>

                <form id="formEntrada">

                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" placeholder="123.456.789-10" autocomplete="off" required>
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" placeholder="Mínimo de 8 caracteres" autocomplete="off"
                            required>
                    </div>

                    <button type="submit" class="botao-principal">
                        Entrar como usuário
                    </button>

                </form>

            </section>

            <!-- CARTÃO DA DIREÇÃO -->
            <section class="cartao cartao-entrada">

                <h1>Acesso da Direção</h1>

                <p class="subtitulo">
                    Entre para visualizar os chamados da escola.
                </p>

                <form id="formDirecao">

                    <div class="campo">
                        <label for="cpfDirecao">CPF</label>
                        <input type="text" id="cpfDirecao" placeholder="123.456.789-10" autocomplete="off" required>
                    </div>

                    <div class="campo">
                        <label for="senhaDirecao">Senha</label>
                        <input type="password" id="senhaDirecao" placeholder="Mínimo de 8 caracteres" autocomplete="off"
                            required>
                    </div>

                    <button type="submit" class="botao-principal">
                        Entrar como Direção
                    </button>

                </form>

            </section>

        </div>

    </main>

    <footer class="rodape">
        <p>Copyright © 2026 by João Pedro</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="banco/config.js"></script>
    <script src="banco/supabase.js"></script>
    <script src="entrada.js"></script>

</body>

</html>
