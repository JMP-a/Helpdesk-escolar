
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrada - Helpdesk Escolar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topo">
        <div class="topo-conteudo">
            <div class="topo-marca">Helpdesk Escolar</div>
        </div>
    </header>

    <main class="conteudo-entrada">

        <section class="cartao cartao-entrada">

            <h1>Acesso ao sistema</h1>

            <p class="subtitulo">
                Entre para acessar o Helpdesk Escolar.
            </p>

            <form onsubmit="event.preventDefault(); entrarDemo();">

                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input
                        type="text"
                        id="cpf"
                        placeholder="CPF fictício"
                        autocomplete="off"
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Senha fictícia"
                        autocomplete="off"
                    >
                </div>

                <button type="submit" class="botao-principal">
                    Entrar na demonstração
                </button>

            </form>
            
        </section>

    </main>

    <footer class="rodape">
        <p>Copyright © 2026 by João Pedro</p>
    </footer>

    <script>
        function entrarDemo() {
            window.location.href = "criar.html";
        }
    </script>

</body>
</html>
