<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpDesk Escolar - Chamados</title>
    <link rel="stylesheet" href="style.css">

    <script src="JS/storage.js" defer></script>
    <script src="chamados.js" defer></script>
</head>

<body>
    <header class="topo">
        <div class="topo-conteudo">
            <span class="topo-marca">HelpDesk Escolar</span>

            <div class="campo campo-pesquisa">
                <label for="buscar-chamados">Buscar chamados</label>

                <input type="search" id="buscar-chamados" placeholder="Nome ou descrição...">
            </div>

            <nav class="topo-nav">
                <a href="criar.html">Abrir Chamado</a>
                <a href="chamados.html" class="ativo">Ver Chamados</a>
            </nav>
        </div>
    </header>

    <main class="conteudo conteudo-larga">

        <div class="cabecalho-lista">
            <div>
                <h1>Chamados registrados</h1>

                <p class="subtitulo">
                    Acompanhe, filtre e atualize o status dos chamados.
                </p>
            </div>

            <div class="controles-lista">

                <div class="campo campo-filtro">
                    <label for="filtro-status">Filtrar por status</label>

                    <select id="filtro-status">
                        <option value="Todos">Todos</option>
                        <option value="Aberto">Aberto</option>
                        <option value="Em andamento">Em andamento</option>
                        <option value="Resolvido">Resolvido</option>
                    </select>
                </div>

                <div class="campo campo-filtro">
                    <label for="ordenar-chamados">Ordenar por</label>

                    <select id="ordenar-chamados">
                        <option value="recente">Mais recente primeiro</option>
                        <option value="antigo">Mais antigo primeiro</option>
                        <option value="prioridade">Prioridade (Alta → Baixa)</option>
                    </select>
                </div>

            </div>

        </div>
        </div>

        <div id="lista-chamados" class="lista-chamados"></div>

        <p id="mensagem-vazia" class="mensagem-vazia" hidden>
            Nenhum chamado encontrado para esse filtro.
        </p>

    </main>

    <footer class="rodape">
        <p>Copyright © 2026 by João Pedro</p>
    </footer>

    <!-- Biblioteca Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Configuração e conexão -->
    <script src="banco/config.js"></script>
    <script src="banco/supabase.js"></script>

    <!-- Proteção da página -->
    <script>
        (async function protegerChamados() {

            // Verifica se existe sessão
            const { data: { session }, error } =
                await supabaseClient.auth.getSession();

            if (error || !session) {
                window.location.href = "index.html";
                return;
            }

            // Busca perfil do usuário logado
            const { data: perfil, error: erroPerfil } =
                await supabaseClient
                    .from("perfis")
                    .select("tipo")
                    .eq("id", session.user.id)
                    .single();

            // Se não encontrar perfil, bloqueia
            if (erroPerfil || !perfil) {
                window.location.href = "index.html";
                return;
            }

            // Só diretor pode entrar no painel
            if (perfil.tipo !== "diretor") {
                window.location.href = "criar.html";
                return;
            }

            // Se passou por todas as verificações, carrega o painel
            const script = document.createElement("script");
            script.src = "app.js";
            document.body.appendChild(script);

        })();
    </script>

</body>

</html>
