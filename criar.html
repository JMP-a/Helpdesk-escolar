<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpDesk Escolar - Abrir Chamado</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2F6F5E">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="topo">
        <div class="topo-conteudo">
            <span class="topo-marca">HelpDesk Escolar</span>

            <nav class="topo-nav">
                <a href="criar.html" class="ativo">Abrir Chamado</a>
                <a href="chamados.html">Ver Chamados</a>
            </nav>
        </div>
    </header>

    <main class="conteudo">
        <div class="cartao">
            <h1>Abrir novo chamado</h1>

            <p class="subtitulo">
                Descreva o problema encontrado na escola.
                A equipe responsável vai analisar e atualizar o status.
            </p>

            <form id="form-chamado">
                <div class="campo">
                    <label for="solicitante">Nome do solicitante</label>
                    <input type="text" id="solicitante" name="solicitante" placeholder="Digite seu nome" required>
                </div>

                <div class="campo">
                    <label for="setor">Setor ou local do problema</label>
                    <input type="text" id="setor" name="setor" placeholder="Ex: Sala 12, laboratório 2, secretaria"
                        required>
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>
                    <select id="prioridade" name="prioridade" required>
                        <option value="" disabled selected>Selecione</option>
                        <option value="Baixa">Baixa</option>
                        <option value="Média">Média</option>
                        <option value="Alta">Alta</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="descricao">Descrição do problema</label>
                    <textarea id="descricao" name="descricao" rows="4"
                        placeholder="Explique com detalhes o que está acontecendo." required></textarea>
                </div>

                <button type="submit" class="botao-principal">
                    Registrar chamado
                </button>

                <p id="mensagem-status" class="mensagem-status" role="status" aria-live="polite"></p>
            </form>
        </div>
    </main>

    <footer class="rodape">
        <p>Copyright © 2026 by João Pedro</p>
    </footer>

    <!-- Biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Configuração e conexão -->
    <script src="banco/config.js"></script>
    <script src="banco/supabase.js"></script>

    <!-- Proteção da página de criação -->
    <script>
        (async function protegerCriar() {

            // Verifica se está logado
            const { data: { session }, error } =
                await supabaseClient.auth.getSession();

            if (error || !session) {
                window.location.href = "index.html";
                return;
            }

            // Busca o perfil do usuário
            const { data: perfil, error: erroPerfil } =
                await supabaseClient
                    .from("perfis")
                    .select("tipo, nome")
                    .eq("id", session.user.id)
                    .single();

            // Sem perfil válido, volta ao login
            if (erroPerfil || !perfil) {
                await supabaseClient.auth.signOut();
                window.location.href = "index.html";
                return;
            }

            // Permite aluno, professor e diretor
            const perfisPermitidos = ["aluno", "professor", "diretor"];

            if (!perfisPermitidos.includes(perfil.tipo)) {
                window.location.href = "index.html";
                return;
            }

            // Guarda os dados do usuário
            localStorage.setItem("nomeUsuario", perfil.nome);
            localStorage.setItem("tipoUsuario", perfil.tipo);

            // Carrega o armazenamento e o formulário somente após validar
            const storage = document.createElement("script");
            storage.src = "JS/storage.js";

            storage.onload = function () {
                const app = document.createElement("script");
                app.src = "app.js";
                document.body.appendChild(app);
            };

            document.body.appendChild(storage);

        })();
    </script>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./service-worker.js")
                .then(registro => {
                    console.log("Service Worker registrado!", registro);
                })
                .catch(erro => {
                    console.error("Erro ao registrar Service Worker:", erro);
                });
        }
    </script>

</body>

</html>
